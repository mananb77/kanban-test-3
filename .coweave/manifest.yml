apiVersion: coweave.ai/v2
kind: TestEnvironment

metadata:
  generatedBy: hand-authored
  generatedAt: "2026-04-21T03:40:00Z"

# ──────────────────────────────────────────────────────────────────
# Spec — consumed by qa-infrastructure-setup-manifest-driven and the
# downstream build + deploy + test workflows.
# ──────────────────────────────────────────────────────────────────
spec:
  # Language stack. Enum: node-typescript | python | go | java | other.
  # The Quick Poll app is plain JS but rides the same pipeline as TS.
  stack: node-typescript

  # Infrastructure entrypoint: exactly one of compose OR helm (helm is
  # stubbed in v0.1 — compose is the supported path). The sandbox
  # runner shells out to docker-compose with this file.
  entrypoint:
    compose:
      file: docker-compose.yml

  # Informational: downstream build can hint at language/runtime targets.
  dependencies:
    - "node@20"
    - "better-sqlite3"
    - "express"
    - "react"
    - "vite"

  # Tests — executed by qa-test-execution-workflow inside the sandbox.
  # BASE_URL is injected by the test runner at execution time.
  # No framework-based suite yet (TDD §10.1 specifies manual + curl
  # acceptance); smoke tests here mirror the curl-level acceptance
  # checks performed during dev iteration 1.
  tests:
    command: |
      set -euo pipefail
      : "${BASE_URL:?BASE_URL must be set by the test runner}"
      # UI served
      curl -sf "$BASE_URL/" | grep -q '<div id="root">'
      # Create poll
      POLL=$(curl -sf -X POST "$BASE_URL/api/polls" \
        -H 'content-type: application/json' \
        -d '{"question":"smoke?","options":["yes","no"]}')
      POLL_ID=$(echo "$POLL" | jq -r .id)
      # Fetch poll
      curl -sf "$BASE_URL/api/polls/$POLL_ID" | jq -e '.options | length == 2'
      # Cast vote
      curl -sf -X POST "$BASE_URL/api/polls/$POLL_ID/vote" \
        -H 'content-type: application/json' \
        -d '{"optionIndex":0}'
      # Verify increment
      curl -sf "$BASE_URL/api/polls/$POLL_ID" | jq -e '.options[0].vote_count == 1'
    reportDir: test-reports
    timeoutSec: 300
