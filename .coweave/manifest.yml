apiVersion: coweave.ai/v2
kind: TestEnvironment

metadata:
  generatedBy: hand-authored
  generatedAt: "2026-04-22T06:15:00Z"

# ──────────────────────────────────────────────────────────────────
# Spec — consumed by qa-infrastructure-setup-manifest-driven and the
# downstream build + deploy + test workflows.
# ──────────────────────────────────────────────────────────────────
spec:
  # Language stack. Enum: node-typescript | python | go | java | other.
  # The Quick Poll app is plain JS but rides the same pipeline as TS.
  stack: node-typescript

  # Infrastructure entrypoint: exactly one of compose OR helm (helm is
  # stubbed in v0.1 — compose is the supported path). The sandbox
  # runner shells out to docker-compose with this file.
  entrypoint:
    compose:
      file: ../docker-compose.yml

  # Informational: downstream build can hint at language/runtime targets.
  dependencies:
    - "node@20"
    - "better-sqlite3"
    - "express"
    - "react"
    - "vite"

  # Tests — executed by qa-test-execution-workflow inside the sandbox.
  # coweave-infra 0.2.5+ invokes this via `docker exec <sandbox> bash -c`,
  # i.e. INSIDE the quick-poll container. localhost:3001 is the app's
  # own port inside that container, so no BASE_URL injection needed.
  # curl + jq are present in the runtime image (see Dockerfile runtime
  # stage) — kept there deliberately so smoke authors aren't forced
  # to write test scripts in the app's language.
  tests:
    command: |
      set -euo pipefail
      BASE_URL="${BASE_URL:-http://localhost:3001}"

      # 1. UI served with React root
      curl -sf "$BASE_URL/" | grep -q '<div id="root">'

      # 2. Create poll
      POLL=$(curl -sf -X POST "$BASE_URL/api/polls" \
        -H 'content-type: application/json' \
        -d '{"question":"smoke?","options":["yes","no"]}')
      POLL_ID=$(echo "$POLL" | jq -r .id)
      [ -n "$POLL_ID" ] && [ "$POLL_ID" != "null" ] || { echo "create: no id"; exit 1; }

      # 3. Fetch poll
      curl -sf "$BASE_URL/api/polls/$POLL_ID" | jq -e '.options | length == 2' > /dev/null

      # 4. Cast vote
      curl -sf -X POST "$BASE_URL/api/polls/$POLL_ID/vote" \
        -H 'content-type: application/json' \
        -d '{"optionIndex":0}' > /dev/null

      # 5. Verify increment persisted
      curl -sf "$BASE_URL/api/polls/$POLL_ID" \
        | jq -e '.options[0].vote_count == 1' > /dev/null

      echo "✓ smoke suite passed: index, create, fetch, vote, persist"
    reportDir: test-reports
    timeoutSec: 300
